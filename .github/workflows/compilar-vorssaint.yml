# Compila Vorssaint desde este código para usarlo en el Mac de rlssj (artefacto "Vorssaint"),
# y mide cuánto gasta en reposo (memoria real y procesador) junto a ScrollFlip para comparar.
name: Compilar Vorssaint

on:
  push:
    branches: [vorssaint]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Compilar Vorssaint
        run: |
          ./build.sh
          # Ad-hoc signatures are identified by their hash, which changes with every build and makes macOS forget
          # Accessibility and other permissions. Requiring only the bundle identifier keeps them across builds.
          codesign --force -s - -r='designated => identifier "com.vorssaint.utils"' build/stage/Vorssaint.app
          codesign -dr - build/stage/Vorssaint.app
          ditto -c -k --keepParent build/stage/Vorssaint.app Vorssaint.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vorssaint
          path: Vorssaint.zip

      - name: Descargar ScrollFlip publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0 -R "$GITHUB_REPOSITORY" -p ScrollFlip.dmg
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sf ScrollFlip.dmg
          mkdir scrollflip && ditto /tmp/sf/ScrollFlip.app scrollflip/ScrollFlip.app
          hdiutil detach /tmp/sf

      - name: Medir
        run: |
          # sums memory (phys_footprint) and CPU time over every process of an app, children included
          measure() {
            local name=$1 path=$2
            local pids=$(pgrep -f "$path" | tr '\n' ' ')
            local mem=0 cpu=0
            for pid in $pids; do
              kb=$(footprint $pid 2>/dev/null | awk '/phys_footprint:/ {v=$2; u=$3; if (u=="MB") v*=1024; print int(v); exit}')
              mem=$((mem + ${kb:-0}))
            done
            cpu=$(ps -o time= -p ${pids// /,} 2>/dev/null | awk -F'[:.]' '{s += $1*60 + $2 + $3/100} END {printf "%.2f", s}')
            echo "$name: $(echo $pids | wc -w | tr -d ' ') procesos, memoria $((mem/1024)) MB, CPU acumulada ${cpu} s"
          }
          VAPP=build/stage/Vorssaint.app
          echo "Vorssaint: $VAPP"; ls "$VAPP/Contents/MacOS"
          "$VAPP/Contents/MacOS/$(ls "$VAPP/Contents/MacOS" | head -1)" > vorssaint.log 2>&1 &
          scrollflip/ScrollFlip.app/Contents/MacOS/ScrollFlip --background > scrollflip.log 2>&1 &
          sleep 30
          echo "== a los 30 s"
          measure Vorssaint "$VAPP"
          measure ScrollFlip scrollflip/ScrollFlip.app
          sleep 60
          echo "== a los 90 s (60 s más en reposo)"
          measure Vorssaint "$VAPP"
          measure ScrollFlip scrollflip/ScrollFlip.app
          echo "== tamaño en disco"
          du -sh "$VAPP" scrollflip/ScrollFlip.app
          echo "== procesos de Vorssaint"
          ps -o pid,rss,time,args -p $(pgrep -f "$VAPP" | tr '\n' ',' | sed 's/,$//') | cut -c1-160
          echo "== log de Vorssaint"; tail -20 vorssaint.log
