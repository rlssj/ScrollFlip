# Compila ScrollFlip en GitHub y la publica como instalador (ScrollFlip.dmg) en la release de su versión,
# junto con capturas de la ventana de ajustes para revisar el diseño.
name: Compilar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Elegir el Xcode más nuevo
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Compilar
        run: ./build.sh

      - name: Capturas de los ajustes
        run: ScrollFlip.app/Contents/MacOS/ScrollFlip --snapshot capturas

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas

      - name: Probar el botón rojo
        continue-on-error: true
        run: |
          # launched from this shell so it shares the runner's Accessibility permission
          SCROLLFLIP_DEBUG=1 ScrollFlip.app/Contents/MacOS/ScrollFlip --background &
          sleep 5
          swiftc -O -o close-test Tests/CloseButtonTest.swift
          ./close-test

      - name: Crear el instalador
        run: |
          mkdir dmg
          cp -R ScrollFlip.app dmg/
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname ScrollFlip -srcfolder dmg -ov -format UDZO ScrollFlip.dmg

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" ScrollFlip.app/Contents/Info.plist)
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" --title "ScrollFlip $version" --latest \
              --notes "Descarga **ScrollFlip.dmg**, ábrelo y arrastra ScrollFlip a Aplicaciones."
          fi
          gh release upload "v$version" ScrollFlip.dmg --clobber
